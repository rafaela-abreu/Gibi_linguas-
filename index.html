<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMIC DICTIONARY POW! 💥</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Inter:wght@400;700&display=swap');

        :root {
            --bg-color: #ffde59;
            --panel-bg: #ffffff;
            --border-color: #000000;
            --accent-red: #ff3333;
            --accent-blue: #00f0ff;
            --shadow: 4px 4px 0px #000000;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#000000 15%, transparent 16%), radial-gradient(#000000 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            color: #000;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3.2rem;
            color: #fff;
            text-shadow: 4px 4px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000;
            letter-spacing: 2px;
            margin: 0;
            transform: rotate(-2deg);
        }

        .subtitle {
            font-family: 'Permanent Marker', cursive;
            background: var(--accent-blue);
            display: inline-block;
            padding: 4px 12px;
            border: 3px solid var(--border-color);
            box-shadow: var(--shadow);
            transform: rotate(1deg);
            font-size: 1rem;
            margin-top: 5px;
        }

        /* Seletor de Idiomas */
        .lang-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .lang-selector::-webkit-scrollbar {
            display: none;
        }

        .lang-btn {
            background: #fff;
            border: 3px solid var(--border-color);
            padding: 8px 12px;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            white-space: nowrap;
            transition: transform 0.1s;
        }

        .lang-btn.active {
            background: var(--accent-red);
            color: #fff;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000;
        }

        /* Grade de Palavras Prontas (Toque para ver) */
        .words-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-card-btn {
            background: #fff;
            border: 3px solid var(--border-color);
            padding: 12px;
            font-family: 'Bangers', cursive;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            text-align: left;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s;
        }

        .word-card-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .word-card-btn span {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #555;
            font-weight: bold;
        }

        /* Painel de Resultados estilo HQ */
        .comic-panel {
            background: var(--panel-bg);
            border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0px #000;
            padding: 20px;
            position: relative;
        }

        .comic-panel::before {
            content: "💥 POW!";
            position: absolute;
            top: -15px;
            right: 15px;
            background: var(--accent-red);
            color: #fff;
            font-family: 'Bangers', cursive;
            padding: 2px 8px;
            border: 2px solid #000;
            transform: rotate(5deg);
            font-size: 1rem;
        }

        .word-title {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            color: #111;
        }

        .phonetic {
            font-family: 'Permanent Marker', cursive;
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .translation {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 12px;
            background: #fffae6;
            padding: 10px;
            border: 2px dashed #000;
        }

        .example-box {
            background: #eefcff;
            border: 2px solid #000;
            padding: 10px;
            margin-top: 10px;
            font-style: italic;
        }

        .audio-btn {
            background: var(--accent-blue);
            border: 3px solid #000;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .audio-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>COMIC DICTIONARY</h1>
            <div class="subtitle">Toque nas expressões e aprenda na hora! ⚡</div>
        </header>

        <!-- Seletor de Idiomas -->
        <div class="lang-selector" id="langSelector">
            <button class="lang-btn active" data-lang="en">🇬🇧 Inglês</button>
            <button class="lang-btn" data-lang="es">🇪🇸 Espanhol</button>
            <button class="lang-btn" data-lang="zh">🇨🇳 Mandarim</button>
            <button class="lang-btn" data-lang="ja">🇯🇵 Japonês</button>
            <button class="lang-btn" data-lang="ko">🇰🇷 Coreano</button>
            <button class="lang-btn" data-lang="ru">🇷🇺 Russo</button>
        </div>

        <!-- Grade de Escolha Rápida (Sem precisar digitar nada!) -->
        <div class="words-grid" id="wordsGrid">
            <!-- Os botões entram aqui automaticamente via script -->
        </div>

        <!-- Painel onde o significado aparece -->
        <div id="resultContainer">
            <div class="comic-panel">
                <h2 class="word-title">⚡ Escolha uma expressão acima!</h2>
                <p>Basta tocar em qualquer card para ver a tradução, a pronúncia e ouvir o áudio nativo imediatamente.</p>
            </div>
        </div>
    </div>

    <script>
        // Banco de dados completo com termos reais por idioma
        const dictionaryData = {
            en: [
                { word: "Hello", meaning: "Olá / Alô", phonetic: "/həˈloʊ/", example: "Hello, superhero! Ready to save the day?" },
                { word: "Awesome", meaning: "Incrível / Espetacular", phonetic: "/ˈɔː.səm/", example: "That action sequence was awesome!" },
                { word: "Thank you", meaning: "Obrigado(a)", phonetic: "/ˈθæŋk juː/", example: "Thank you for helping me out." },
                { word: "No way!", meaning: "Não acredito! / De jeito nenhum!", phonetic: "/noʊ weɪ/", example: "No way! You built this app yourself?" }
            ],
            es: [
                { word: "¡Hola!", meaning: "Olá!", phonetic: "/ˈo.la/", example: "¡Hola, amigo! ¿Cómo va todo?" },
                { word: "Genial", meaning: "Genial / Incrível", phonetic: "/xeˈnjal/", example: "¡Qué aplicación tan genial!" },
                { word: "Gracias", meaning: "Obrigado(a)", phonetic: "/ˈɣɾa.sjas/", example: "Muchas gracias por la ayuda." },
                { word: "¡Qué chulo!", meaning: "Que legal! / Que massa!", phonetic: "/ke ˈtʃu.lo/", example: "¡Qué chulo está este diseño!" }
            ],
            zh: [
                { word: "Nǐ hǎo", meaning: "Olá", phonetic: "Nǐ hǎo (Pinyin)", example: "你好！很高兴见到你。(Olá! Prazer em te conhecer.)" },
                { word: "Xièxie", meaning: "Obrigado(a)", phonetic: "Xièxie (Pinyin)", example: "谢谢你的 Dica!(Obrigado pela dica!)" },
                { word: "Hǎo", meaning: "Bom / Legal", phonetic: "Hǎo (Pinyin)", example: "这个主意很好。(Esta ideia é muito boa.)" },
                { word: "Péngyǒu", meaning: "Amigo / Amiga", phonetic: "Péngyǒu (Pinyin)", example: "我们是好朋友。(Nós somos bons amigos.)" }
            ],
            ja: [
                { word: "Konnichiwa", meaning: "Olá / Boa tarde", phonetic: "こんにちは (Romaji)", example: "こんにちは、元気ですか？ (Olá, tudo bem?)" },
                { word: "Arigatou", meaning: "Obrigado(a)", phonetic: "ありがとう (Romaji)", example: "いつもありがとう！ (Muito obrigado sempre!)" },
                { word: "Sugoi", meaning: "Incrível / Demais", phonetic: "すごい (Romaji)", example: "このアプリはすごいね！ (Este app é incrível!)" },
                { word: "Kawaii", meaning: "Fofo / Bonitinho", phonetic: "かわいい (Romaji)", example: "このデザインはかわいい！ (Este design é fofo!)" }
            ],
            ko: [
                { word: "Annyeong", meaning: "Oi / Olá (Informal)", phonetic: "안녕", example: "안녕! 오늘 어때? (Oi! Como vai hoje?)" },
                { word: "Gamsahamnida", meaning: "Obrigado(a) (Formal)", phonetic: "감사합니다", example: "도움 주셔서 감사합니다. (Obrigado por ajudar.)" },
                { word: "Daebak", meaning: "Sensacional / Sucesso", phonetic: "대박", example: "이 앱 정말 대박이다! (Esse app é realmente sensacional!)" },
                { word: "Meotjin", meaning: "Estiloso / Maneiro", phonetic: "멋진", example: "멋진 웹사이트네요! (Que site estiloso!)" }
            ],
            ru: [
                { word: "Privet", meaning: "Oi / Olá", phonetic: "Привет (Cirílico)", example: "Привет, как дела? (Oi, como vai?)" },
                { word: "Spasibo", meaning: "Obrigado(a)", phonetic: "Спасибо (Cirílico)", example: "Большое спасибо! (Muito obrigado!)" },
                { word: "Krasivo", meaning: "Bonito / Legal", phonetic: "Красиво (Cirílico)", example: "Это очень красиво! (Isso é muito bonito!)" },
                { word: "Kruto", meaning: "Legal / Show", phonetic: "Круто (Cirílico)", example: "Это получилось круто! (Isso ficou legal!)" }
            ]
        };

        let currentLang = 'en';

        const langSelector = document.getElementById('langSelector');
        const wordsGrid = document.getElementById('wordsGrid');
        const resultContainer = document.getElementById('resultContainer');

        function renderWords(lang) {
            const list = dictionaryData[lang] || [];
            wordsGrid.innerHTML = '';
            
            list.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'word-card-btn';
                btn.innerHTML = `
                    ${item.word}
                    <span>${item.meaning.split('/')[0]}</span>
                `;
                btn.addEventListener('click', () => showWordDetail(lang, index));
                wordsGrid.appendChild(btn);
            });

            // Mostra o primeiro item por padrão ao trocar de idioma
            if (list.length > 0) {
                showWordDetail(lang, 0);
            }
        }

        function showWordDetail(lang, index) {
            const item = dictionaryData[lang][index];
            resultContainer.innerHTML = `
                <div class="comic-panel">
                    <h2 class="word-title">${item.word}</h2>
                    <div class="phonetic">Pronúncia: ${item.phonetic}</div>
                    <div class="translation">📖 Significado: ${item.meaning}</div>
                    <div class="example-box">💬 <strong>Exemplo:</strong> "${item.example}"</div>
                    <button class="audio-btn" onclick="speakWord('${item.word}', '${lang}')">🔊 Ouvir Áudio</button>
                </div>
            `;
        }

        // Trocar de Idioma
        langSelector.addEventListener('click', (e) => {
            if (e.target.classList.contains('lang-btn')) {
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentLang = e.target.getAttribute('data-lang');
                renderWords(currentLang);
            }
        });

        // Síntese de Voz Nativa
        function speakWord(text, lang) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'zh' ? 'zh-CN' : lang === 'ja' ? 'ja-JP' : lang === 'ko' ? 'ko-KR' : lang === 'ru' ? 'ru-RU' : lang === 'es' ? 'es-ES' : 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Seu navegador não suporta áudio nativo!");
            }
        }

        // Inicializa a tela com o primeiro idioma carregado
        renderWords('en');
    </script>
</body>
</html>
